name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar o código base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: O JavaScript não tem erro de sintaxe
        run: node --check script.js

      - name: HTML, CSS e JavaScript combinam entre si
        run: node .github/scripts/verificar.js
